[package]
name = "ballista-plugin-template"
version = "1.0.0"
edition = "2024"
description = "Starter template for Native Ballista Rust plugins"
authors = ["yourhandle"]
license = "GPL-3.0-or-later"

[[bin]]
name = "ballista-my-plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
