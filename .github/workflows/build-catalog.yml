name: Build Catalog

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "scripts/build_catalog.py"
  schedule:
    # Daily check at 00:00 UTC to expire 7-day new arrivals and refresh weekly Spotlight rotation
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile catalog.json from plugins/*/plugin.json
        run: python3 scripts/build_catalog.py

      - name: Verify compiled catalog
        run: python3 scripts/validate.py --skip-network --check-catalog-sync

      - name: Commit updated catalog.json
        run: |
          if git diff --quiet catalog.json; then
            echo "catalog.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): rebuild catalog.json from plugin manifests"
          git push
