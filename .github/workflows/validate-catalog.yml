name: Validate Catalog

on:
  pull_request:
    paths:
      - "catalog.json"
  push:
    branches:
      - main
    paths:
      - "catalog.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate catalog.json schema & URLs
        run: |
          python3 - <<'PYEOF'
          import json
          import sys
          import urllib.request
          import urllib.error

          VALID_CATEGORIES = {
              "Utility", "System", "Audio", "Streaming", "Productivity", "Developer"
          }
          VALID_DEVICES = {
              "StreamDeckOriginal", "StreamDeckMK2", "StreamDeckMini",
              "StreamDeckXL", "StreamDeckNeo", "StreamDeckPlus",
              "StreamDeckPlusXL", "StreamDeckPedal", "StreamDeckStudio",
          }
          REQUIRED_FIELDS = [
              "id", "name", "author", "version", "category",
              "description", "github_url", "download_url", "icon", "thumbnail"
          ]

          with open("catalog.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          errors = []
          if "plugins" not in data or not isinstance(data["plugins"], list):
              errors.append("Top-level 'plugins' must be a JSON array.")
          else:
              seen_ids = set()
              for idx, p in enumerate(data["plugins"]):
                  pid = p.get("id", f"<index {idx}>")
                  for field in REQUIRED_FIELDS:
                      val = p.get(field)
                      if not isinstance(val, str) or not val.strip():
                          errors.append(f"[{pid}] Missing or empty required string field: '{field}'")

                  if isinstance(p.get("id"), str):
                      if p["id"] in seen_ids:
                          errors.append(f"[{pid}] Duplicate plugin id")
                      seen_ids.add(p["id"])

                  cat = p.get("category")
                  if cat and cat not in VALID_CATEGORIES:
                      errors.append(f"[{pid}] Invalid category '{cat}'. Allowed: {sorted(VALID_CATEGORIES)}")

                  for dev in p.get("compatible_devices", []):
                      if dev not in VALID_DEVICES:
                          errors.append(f"[{pid}] Invalid compatible_device '{dev}'. Allowed: {sorted(VALID_DEVICES)}")

                  for url_field in ("github_url", "download_url", "icon", "thumbnail"):
                      url = p.get(url_field, "")
                      if url_field == "icon" and not url.startswith("http"):
                          continue  # Allow standard GTK symbolic icon names
                      if not url.startswith("https://"):
                          errors.append(f"[{pid}] '{url_field}' must start with https:// (got: {url!r})")
                          continue
                      req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "Ballista-Market-Validator/1.0"})
                      try:
                          with urllib.request.urlopen(req, timeout=15) as resp:
                              if resp.status >= 400:
                                  errors.append(f"[{pid}] '{url_field}' returned HTTP {resp.status}: {url}")
                      except urllib.error.HTTPError as e:
                          if e.code == 405:
                              # Some endpoints reject HEAD; fall back to GET range
                              req_get = urllib.request.Request(url, headers={"User-Agent": "Ballista-Market-Validator/1.0", "Range": "bytes=0-0"})
                              try:
                                  with urllib.request.urlopen(req_get, timeout=15) as r2:
                                      if r2.status >= 400:
                                          errors.append(f"[{pid}] '{url_field}' returned HTTP {r2.status}: {url}")
                              except Exception as e2:
                                  errors.append(f"[{pid}] Failed to reach '{url_field}' ({url}): {e2}")
                          else:
                              errors.append(f"[{pid}] '{url_field}' returned HTTP {e.code}: {url}")
                      except Exception as e:
                          errors.append(f"[{pid}] Failed to reach '{url_field}' ({url}): {e}")

          if errors:
              print("Catalog validation FAILED:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print(f"Catalog validation PASSED ({len(data['plugins'])} plugins verified).")
          PYEOF
