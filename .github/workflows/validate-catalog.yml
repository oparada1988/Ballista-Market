name: Validate Catalog

on:
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - "catalog.json"
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "scripts/**"
      - "catalog.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate plugin manifests & URLs
        run: python3 scripts/validate.py
